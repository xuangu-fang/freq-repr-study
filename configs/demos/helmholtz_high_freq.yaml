name: helmholtz

resolution: 64
num_frequencies: 32

# High frequency wave numbers
wave_number_grid:
  type: linear
  start: 20.0
  end: 100.0

epsilon: 0.01  # Small imaginary part to avoid resonance singularity

source:
  type: gaussian_blobs
  num_blobs_min: 2
  num_blobs_max: 5
  sigma_min: 0.03
  sigma_max: 0.12
  amplitude_min: 0.5
  amplitude_max: 1.5