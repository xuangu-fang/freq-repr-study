name: phase_family

resolution: 64
num_frequencies: 32

frequency_grid:
  type: linear
  start: 2.0
  end: 20.0

amplitude:
  type: smooth_random
  low: 0.5
  high: 1.5
  smoothing_sigma: 6.0

tau:
  type: smooth_random
  low: 0.0
  high: 1.0
  smoothing_sigma: 8.0

phi:
  type: smooth_random
  low: -3.14159
  high: 3.14159
  smoothing_sigma: 8.0