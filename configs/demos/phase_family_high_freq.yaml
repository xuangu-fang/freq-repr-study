name: phase_family

resolution: 128  # 提高分辨率以捕捉高频振荡
num_frequencies: 32

frequency_grid:
  type: linear
  start: 20.0    # 从原始配置的最高频率开始
  end: 200.0     # 10倍于原始最高频率，测试高频效应

amplitude:
  type: smooth_random
  low: 0.5
  high: 1.5
  smoothing_sigma: 6.0

tau:
  type: smooth_random
  low: 0.0
  high: 1.0
  smoothing_sigma: 8.0

phi:
  type: smooth_random
  low: -3.14159
  high: 3.14159
  smoothing_sigma: 8.0